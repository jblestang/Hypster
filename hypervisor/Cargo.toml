[package]
name = "hypster"
description = "Hypster static x86-64 hypervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "hypster"
path = "src/lib.rs"

[[bin]]
name = "hypster"
path = "src/main.rs"
test = false

[dependencies]
hv-boot-abi = { workspace = true }
hv-core = { path = "../crates/hv-core", default-features = false }
hv-runtime = { path = "../crates/hv-runtime" }
hv-types = { workspace = true, default-features = false }
hv-ept = { path = "../crates/hv-ept", default-features = false }
hv-vtd = { path = "../crates/hv-vtd", default-features = false }

[lints]
workspace = true
