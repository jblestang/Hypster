[package]
name = "guest-out"
description = "Hypster OUT partition guest stub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "guest_out"
path = "src/lib.rs"
test = false

[[bin]]
name = "guest-out"
path = "src/main.rs"
