name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --exclude hv-loader --exclude hypster --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --exclude hv-loader --exclude hypster
      - name: validate config
        run: cargo xtask config validate configs/qemu.yaml
      - name: generate config
        run: cargo xtask config generate configs/qemu.yaml
