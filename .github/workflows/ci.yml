name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
          targets: x86_64-unknown-uefi,x86_64-unknown-none
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (host)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (hv-loader uefi)
        run: cargo clippy -p hv-loader --target x86_64-unknown-uefi --all-features -- -D warnings
      - name: clippy (hypster bare-metal)
        run: cargo clippy -p hypster --target x86_64-unknown-none --all-features -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: validate config
        run: cargo xtask config validate configs/qemu.yaml
      - name: generate config
        run: cargo xtask config generate configs/qemu.yaml
      - name: qemu prepare
        run: cargo xtask qemu prepare configs/qemu.yaml
