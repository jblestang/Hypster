[workspace]
resolver = "2"
members = [
    "crates/hv-types",
    "crates/hv-config-model",
    "crates/hv-boot-abi",
    "crates/hv-guest-abi",
    "tools/hv-config",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hypster/hypster"
rust-version = "1.85"

[workspace.dependencies]
hv-types = { path = "crates/hv-types" }
hv-config-model = { path = "crates/hv-config-model" }
hv-boot-abi = { path = "crates/hv-boot-abi" }
hv-guest-abi = { path = "crates/hv-guest-abi" }

serde = { version = "=1.0.217", default-features = false, features = ["derive", "alloc"] }
serde_yaml = "=0.9.34"
thiserror = "=2.0.11"
sha2 = { version = "=0.10.8", default-features = false }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
proptest = "=1.6.0"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "allow"
